name: Build Ceylonese Futurism APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Found app/google-services.json in repository."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            trimmed="$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]')"
            if printf '%s' "$trimmed" | grep -q '^{'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$trimmed" | base64 -d > app/google-services.json
            fi
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          else
            echo "::error::app/google-services.json is missing. Add a repository secret named GOOGLE_SERVICES_JSON (containing app/google-services.json) in GitHub Settings -> Secrets and variables -> Actions, or commit app/google-services.json."
            exit 1
          fi

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"
        run: gradle :app:processDebugGoogleServices :app:assembleDebug --no-daemon

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk Ceylonese-Futurism.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ceylonese-Futurism-APK
          path: Ceylonese-Futurism.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ceylonese Futurism Android APK
          body: |
            Ceylonese Futurism (kushanprabodha.blogspot.com) Sinhala Science Fiction Reader APK.
            Download **Ceylonese-Futurism.apk** below to install on Android or share with readers.
          files: Ceylonese-Futurism.apk
          prerelease: false
          make_latest: true
